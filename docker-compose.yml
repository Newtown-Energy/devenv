name: newtown

services:
  # Simulated RTAC: a Modbus TCP server standing in for the real controller, so
  # the RTAC integration is exercisable without hardware. It serves the same
  # register map neems-data reads (neems_data::rtac::protocol is the single
  # source of truth), which is what keeps the two from drifting apart.
  neems-rtac-sim:
    build:
      context: ../neems-core
      dockerfile: neems-rtac-sim/Dockerfile
    container_name: neems-rtac-sim
    environment:
      # Which site design the stack runs (see neems-core's
      # docs/environment.md). The three Rust services share alarm history,
      # which only means anything under the design that wrote it, so all three
      # take the same value. Unset, or blank as here, means the default.
      - NEEMS_SITE_DESIGN=${NEEMS_SITE_DESIGN:-}
    volumes:
      # Mount source code for live reload
      - ../neems-core:/usr/src/app
      # Named volumes for build artifacts, shared with the other Rust services.
      # Note this is the same target-cache the ceiling below applies to.
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/usr/src/app/target
    restart: unless-stopped

  neems-data:
    build:
      context: ../neems-core
      dockerfile: neems-data/Dockerfile
    container_name: neems-data
    environment:
      - SITE_DATABASE_URL=sqlite:///app/data/site-data.sqlite
      - NEEMS_DEFAULT_SITE=1
      - NEEMS_DEFAULT_COMPANY=1
      # Must match neems-rtac-sim and neems-api; see neems-rtac-sim above.
      - NEEMS_SITE_DESIGN=${NEEMS_SITE_DESIGN:-}
      # The RTAC collector is off unless this is truthy, so that the system
      # never follows a possibly-absent controller in production. Dev has a
      # simulated one standing by, so turn it on here — without it the Modbus
      # path, the readings it writes, and every endpoint serving them are
      # dead locally.
      - RTAC_ENABLED=1
      # The simulator unless overridden. `bin/dosh rtac-real` overrides both to
      # reach a real controller through an SSH tunnel on the host (see the
      # README); a plain `docker compose up -d` goes back to the simulator.
      - RTAC_ADDRESS=${RTAC_ADDRESS:-neems-rtac-sim:502}
      - RTAC_SLAVE_ID=${RTAC_SLAVE_ID:-1}
      # The collector is closed-loop: it polls neems-api for the site's active
      # schedule command and drives the RTAC from it. Without credentials it
      # stays read-only and logs a warning.
      - NEEMS_API_URL=http://neems-api:8000
      - NEEMS_API_EMAIL=superadmin@example.com
      - NEEMS_API_PASSWORD=admin
    volumes:
      - shared-data:/app/data
      # Mount source code for live reload
      - ../neems-core:/usr/src/app
      # Use named volume for build artifacts (faster rebuilds)
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/usr/src/app/target
    extra_hosts:
      # Docker Desktop defines this name itself; Linux needs it spelled out.
      # The real-RTAC tunnel listens on the host, so the collector reaches it
      # by this name.
      - host.docker.internal:host-gateway
    depends_on:
      - neems-rtac-sim
    restart: unless-stopped
    # This service collects and processes data, writing to SQLite

  neems-api:
    build:
      context: ../neems-core
      dockerfile: neems-api/Dockerfile
    container_name: neems-api
    ports:
      - "8000:8000"
    environment:
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=8000
      - DATABASE_URL=sqlite:///app/data/neems-api.db
      - SITE_DATABASE_URL=sqlite:///app/data/site-data.sqlite
      - NEEMS_DEFAULT_EMAIL=superadmin@example.com
      - NEEMS_DEFAULT_PASSWORD=admin
      - NEEMS_STATIC_DIR=/app/static
      - NEEMS_TS_OUTPUT_DIR=/app/ts-types
      # Enables the demo-only write endpoints (/1/Demo/AlarmState and the
      # /1/Alarms/Forced set view). Off unless set, so production stays safe.
      - NEEMS_DEMO_MODE=1
      # Must match neems-rtac-sim and neems-data; see neems-rtac-sim above.
      - NEEMS_SITE_DESIGN=${NEEMS_SITE_DESIGN:-}
      # Ceiling on the target-cache volume below, which neems-api, neems-data
      # and neems-rtac-sim all write into. Cargo never garbage-collects
      # target/, and this volume reached 173 GB and filled the Docker VM's disk
      # before anything swept it (see issue #22). The neems-api entrypoint
      # sweeps down to this size on start and every CARGO_TARGET_SWEEP_INTERVAL
      # seconds after — startup alone is not enough, since `restart:
      # unless-stopped` means a container can run for weeks between starts.
      #
      # One clean build of the whole workspace — every bin and every test
      # binary, single fingerprint, no incremental — measures 5.7 GB. Do not
      # set the ceiling below that: it would only sweep away artifacts that are
      # immediately rebuilt.
      - CARGO_TARGET_MAXSIZE=10GB
      - CARGO_TARGET_SWEEP_INTERVAL=21600
      # target/debug/incremental gets its own budget, applied first, because
      # cargo-sweep will not touch that directory but does count it toward the
      # total — so a large incremental cache would otherwise make the sweep
      # delete every artifact it *can* reach to compensate.
      - CARGO_INCREMENTAL_MAXSIZE_MB=3072
    volumes:
      - shared-data:/app/data
      # Mount source code for live reload
      - ../neems-core:/usr/src/app
      # Mount shared local-types directory for auto-generated TypeScript types
      - ../local-types:/app/ts-types
      # Use named volume for build artifacts (faster rebuilds)
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/usr/src/app/target
    depends_on:
      - neems-data
    restart: unless-stopped
    # API service that reads from the SQLite database

  neems-react:
    build:
      context: ../neems-react
      dockerfile: Dockerfile
    container_name: neems-react
    ports:
      - "5173:5173"
    environment:
      - NEEMS_REACT_PORT=5173
      - NEEMS_CORE_SERVER=http://neems-api:8000
    volumes:
      # Mount source code for live reload
      - ../neems-react:/app
      # Use named volume for node_modules (avoid host/container conflicts)
      - node-modules:/app/node_modules
      # Mount shared local-types directory (bun link connects it into node_modules)
      - ../local-types:/local-types
    command: ["/app/docker-entrypoint.sh"]
    depends_on:
      - neems-api
    restart: unless-stopped
    # React frontend that communicates with the API

volumes:
  shared-data:
    # Shared volume for SQLite database that both neems-data (write) and neems-api (read) access
  cargo-cache:
    # Cargo registry cache for faster Rust builds
  target-cache:
    # Rust build artifacts cache for faster rebuilds
  node-modules:
    # Node modules cache to avoid host/container conflicts
