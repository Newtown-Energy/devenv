name: newtown

services:
  neems-data:
    build:
      context: ../neems-core
      dockerfile: neems-data/Dockerfile
    container_name: neems-data
    environment:
      - SITE_DATABASE_URL=sqlite:///app/data/site-data.sqlite
      - NEEMS_DEFAULT_SITE=1
      - NEEMS_DEFAULT_COMPANY=1
    volumes:
      - shared-data:/app/data
      # Mount source code for live reload
      - ../neems-core:/usr/src/app
      # Use named volume for build artifacts (faster rebuilds)
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/usr/src/app/target
    restart: unless-stopped
    # This service collects and processes data, writing to SQLite

  neems-api:
    build:
      context: ../neems-core
      dockerfile: neems-api/Dockerfile
    container_name: neems-api
    ports:
      - "8000:8000"
    environment:
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=8000
      - DATABASE_URL=sqlite:///app/data/neems-api.db
      - SITE_DATABASE_URL=sqlite:///app/data/site-data.sqlite
      - NEEMS_DEFAULT_EMAIL=superadmin@example.com
      - NEEMS_DEFAULT_PASSWORD=admin
      - NEEMS_STATIC_DIR=/app/static
      - NEEMS_TS_OUTPUT_DIR=/app/ts-types
      # Ceiling on the target-cache volume below, which neems-api, neems-data
      # and neems-rtac-sim all write into. Cargo never garbage-collects
      # target/, and this volume reached 173 GB and filled the Docker VM's disk
      # before anything swept it (see issue #22). The neems-api entrypoint
      # sweeps down to this size on start and every CARGO_TARGET_SWEEP_INTERVAL
      # seconds after — startup alone is not enough, since `restart:
      # unless-stopped` means a container can run for weeks between starts.
      #
      # One clean build of the whole workspace — every bin and every test
      # binary, single fingerprint, no incremental — measures 5.7 GB. Do not
      # set the ceiling below that: it would only sweep away artifacts that are
      # immediately rebuilt.
      - CARGO_TARGET_MAXSIZE=10GB
      - CARGO_TARGET_SWEEP_INTERVAL=21600
      # target/debug/incremental gets its own budget, applied first, because
      # cargo-sweep will not touch that directory but does count it toward the
      # total — so a large incremental cache would otherwise make the sweep
      # delete every artifact it *can* reach to compensate.
      - CARGO_INCREMENTAL_MAXSIZE_MB=3072
    volumes:
      - shared-data:/app/data
      # Mount source code for live reload
      - ../neems-core:/usr/src/app
      # Mount shared local-types directory for auto-generated TypeScript types
      - ../local-types:/app/ts-types
      # Use named volume for build artifacts (faster rebuilds)
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/usr/src/app/target
    depends_on:
      - neems-data
    restart: unless-stopped
    # API service that reads from the SQLite database

  neems-react:
    build:
      context: ../neems-react
      dockerfile: Dockerfile
    container_name: neems-react
    ports:
      - "5173:5173"
    environment:
      - NEEMS_REACT_PORT=5173
      - NEEMS_CORE_SERVER=http://neems-api:8000
    volumes:
      # Mount source code for live reload
      - ../neems-react:/app
      # Use named volume for node_modules (avoid host/container conflicts)
      - node-modules:/app/node_modules
      # Mount shared local-types directory (bun link connects it into node_modules)
      - ../local-types:/local-types
    command: ["/app/docker-entrypoint.sh"]
    depends_on:
      - neems-api
    restart: unless-stopped
    # React frontend that communicates with the API

volumes:
  shared-data:
    # Shared volume for SQLite database that both neems-data (write) and neems-api (read) access
  cargo-cache:
    # Cargo registry cache for faster Rust builds
  target-cache:
    # Rust build artifacts cache for faster rebuilds
  node-modules:
    # Node modules cache to avoid host/container conflicts
