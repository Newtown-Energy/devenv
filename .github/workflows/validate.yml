name: Validate Docker Compose

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout devenv
        uses: actions/checkout@v7
        with:
          path: devenv

      - name: Validate docker-compose.yml
        run: docker compose -f devenv/docker-compose.yml config > /dev/null
